name: Jest Unit Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Lấy code từ repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Cài đặt Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Cài đặt các package
      - name: Install dependencies
        run: npm install

      # Chạy Jest Unit Test
      - name: Run Jest tests
        run: npm test
